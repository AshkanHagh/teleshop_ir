services:
  postgres:
    image: postgres:18.4
    restart: no
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-teleshop}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
    restart: no
    depends_on:
      - postgres
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://admin:password@localhost:5432/teleshop
      - NODE_ENV=production
      - PORT=7319
      - CORS_ORIGIN=http://localhost:5173
    ports:
      - 7319:7319

volumes:
  pgdata:
